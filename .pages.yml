media:
  - name: images
    label: Images
    input: media/images
    output: media/images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe

  - name: documents
    label: Documents
    input: media/files
    output: media/files
    categories: [document]
    extensions: [pdf, doc, docx]
    rename: false

actions:
  - name: sync-cv-to-website
    label: Sync website from CV
    workflow: cv-sync.yml
    ref: current
    cancelable: false
    confirm:
      title: Create website update suggestions from CV?
      message: The workflow reads the DOCX CV, updates selected structured fields, and creates a Pull Request for review. It does not publish the suggestions until you merge the Pull Request.
      button: Create review PR

content:

  - name: design
    label: Design Settings
    type: file
    path: design.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: overallFontScale
        label: Overall text size
        type: number
        description: 1.00 is the current size. Try 0.90 for smaller text or 1.10 for larger text.
        options:
          min: 0.8
          max: 1.3
      - name: heroNameScale
        label: Main name size
        type: number
        description: Controls only the large KyuTae Hwang heading on the first screen. 1.00 is the default.
        options:
          min: 0.7
          max: 1.3
      - name: sectionHeadingScale
        label: Section heading size
        type: number
        description: Controls large headings such as Current manuscript and Selected talks. 1.00 is the default.
        options:
          min: 0.75
          max: 1.3

  - name: website
    label: Website Content
    type: file
    path: data.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: meta
        label: Search / Social
        type: object
        fields:
          - name: title
            label: Browser title
            type: string
          - name: description
            label: Search description
            type: text
          - name: ogDescription
            label: Social sharing description
            type: text

      - name: hero
        label: Hero
        type: object
        fields:
          - name: pill
            label: Top label
            type: string
          - name: name
            label: Name
            type: string
          - name: summary
            label: Introduction
            type: text
          - name: email
            label: Email
            type: string
          - name: profileImage
            label: Profile photo
            type: image
            required: false
            options:
              media: images
              path: profile
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: cv
            label: CV file
            type: file
            required: false
            description: Upload DOCX if you want to use the CV-to-website sync action. PDF can still be used for download, but the included sync parser reads DOCX.
            options:
              media: documents
              extensions: [pdf, doc, docx]
              rename: false

      - name: profile
        label: Profile Card
        type: object
        fields:
          - name: position
            label: Current position
            type: string
          - name: institution
            label: Institution
            type: string
          - name: research
            label: Research area
            type: string
          - name: methods
            label: Methods
            type: text
          - name: location
            label: Location
            type: string

      - name: about
        label: About
        type: object
        fields:
          - name: headline
            label: Headline
            type: text
          - name: text
            label: Description
            type: text

      - name: researchThemes
        label: Research Themes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: label
            label: Category
            type: string
          - name: title
            label: Title
            type: string
          - name: text
            label: Description
            type: text
          - name: tags
            label: Tags
            type: string
            list: true
          - name: image
            label: Optional image
            type: image
            required: false
            options:
              media: images
              path: research
              extensions: [jpg, jpeg, png, webp]
              rename: safe

      - name: selectedWork
        label: Selected Work
        type: object
        fields:
          - name: label
            label: Category
            type: string
          - name: title
            label: Title
            type: text
          - name: paragraphs
            label: Description paragraphs
            type: text
            list: true
          - name: tags
            label: Tags
            type: string
            list: true
          - name: status
            label: Status
            type: string
          - name: year
            label: Year
            type: string
          - name: citation
            label: Citation
            type: text
          - name: journalText
            label: Journal status text
            type: string
          - name: badge
            label: Badge
            type: string
          - name: image
            label: Optional feature image
            type: image
            required: false
            options:
              media: images
              path: selected-work
              extensions: [jpg, jpeg, png, webp]
              rename: safe

      - name: trajectoryHeadline
        label: Trajectory headline
        type: text

      - name: trajectory
        label: Trajectory
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{when} — {title}"
        fields:
          - name: when
            label: Date / period
            type: string
          - name: title
            label: Institution / role
            type: string
          - name: text
            label: Description
            type: text

      - name: presentations
        label: Presentations
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Presentation title
            type: text
          - name: meta
            label: Meeting / year / place / type
            type: string

      - name: resourcesIntro
        label: Data & Methods intro
        type: text

      - name: toolkit
        label: Computational Toolkit
        type: string
        list: true

      - name: interests
        label: Scientific Interests
        type: string
        list: true

      - name: resources
        label: External Resources
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label} — {title}"
        fields:
          - name: label
            label: Type
            type: string
          - name: title
            label: Title
            type: string
          - name: text
            label: Description
            type: text
          - name: url
            label: URL
            type: string
          - name: button
            label: Button text
            type: string

      - name: gallery
        label: Photo Gallery
        type: object
        required: false
        fields:
          - name: headline
            label: Headline
            type: string
          - name: intro
            label: Introduction
            type: text
          - name: items
            label: Photos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - name: image
                label: Image
                type: image
                required: true
                options:
                  media: images
                  path: gallery
                  extensions: [jpg, jpeg, png, webp]
                  rename: safe
              - name: caption
                label: Caption
                type: string
                required: false
              - name: alt
                label: Accessibility description
                type: string
                required: false

      - name: contact
        label: Contact
        type: object
        fields:
          - name: headline
            label: Headline
            type: text
          - name: text
            label: Description
            type: text
