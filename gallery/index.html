<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Academic gallery of KyuTae Hwang">
  <title>Gallery · KyuTae Hwang</title>
  <style>
    :root{--bg:#f3f4f2;--paper:#fbfbf9;--surface:#fff;--ink:#1d2221;--muted:#6c7370;--line:#daddda;--accent:#485b57;--soft:#e1e7e5;--radius:18px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
    nav{position:sticky;top:0;z-index:20;background:rgba(243,244,242,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-weight:800;letter-spacing:-.02em}.links{display:flex;gap:24px;align-items:center;font-size:15px}.links a{color:var(--muted)}.links a:hover,.links a.active{color:var(--ink)}
    header{padding:86px 0 42px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-weight:800;font-size:12px;color:var(--accent);margin-bottom:14px}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(52px,8vw,92px);line-height:.96;letter-spacing:-.055em;margin:0 0 20px;max-width:900px}.intro{font-size:18px;line-height:1.7;color:var(--muted);max-width:760px;margin:0}
    .albums{display:grid;gap:42px;padding:24px 0 96px}.album{border-top:1px solid var(--line);padding-top:28px}.album-head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,.7fr);gap:40px;margin-bottom:22px}.album h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.035em;margin:0 0 10px}.meta{color:var(--muted);font-size:14px;line-height:1.6}.desc{color:var(--muted);line-height:1.7;margin:0}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.photo{grid-column:span 4;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:zoom-in;margin:0}.photo:nth-child(5n+1),.photo:nth-child(5n+4){grid-column:span 6}.photo img{display:block;width:100%;height:290px;object-fit:cover;transition:transform .25s ease}.photo:hover img{transform:scale(1.02)}figcaption{padding:12px 14px;color:var(--muted);font-size:14px;line-height:1.45}
    .empty{padding:64px 0 100px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:28px 0 50px;color:var(--muted);font-size:14px}.foot{display:flex;justify-content:space-between;gap:20px}
    .lightbox{position:fixed;inset:0;z-index:100;background:rgba(10,12,11,.92);display:none;align-items:center;justify-content:center;padding:32px}.lightbox.open{display:flex}.lightbox-inner{max-width:min(1200px,96vw);max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:12px}.lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:10px}.lightbox-cap{color:#fff;text-align:center;max-width:800px}.close{position:absolute;right:24px;top:20px;border:0;background:transparent;color:#fff;font-size:34px;cursor:pointer}
    @media(max-width:800px){.wrap{width:min(100% - 28px,1180px)}.nav{height:64px}.links{gap:14px}.links .hide-mobile{display:none}header{padding:58px 0 30px}.album-head{grid-template-columns:1fr;gap:10px}.photo,.photo:nth-child(5n+1),.photo:nth-child(5n+4){grid-column:span 12}.photo img{height:auto;aspect-ratio:4/3}.foot{flex-direction:column}.lightbox{padding:16px}.close{right:14px;top:10px}}
  </style>
</head>
<body>
<nav><div class="wrap nav"><a class="brand" href="../">KyuTae Hwang</a><div class="links"><a class="hide-mobile" href="../#research">Research</a><a class="hide-mobile" href="../#presentations">Talks</a><a class="active" href="./">Gallery</a><a href="../#contact">Contact</a></div></div></nav>
<header><div class="wrap"><div class="eyebrow">Gallery</div><h1 id="headline">Academic Gallery</h1><p class="intro" id="intro">Conference talks, presentations, and academic moments.</p></div></header>
<main class="wrap"><div id="albums" class="albums"></div><div id="empty" class="empty" hidden>No albums have been published yet.</div></main>
<footer><div class="wrap foot"><span id="footer-name">KyuTae Hwang</span><a href="../">← Back to homepage</a></div></footer>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer"><button class="close" id="close" aria-label="Close">×</button><div class="lightbox-inner"><img id="lightbox-img" alt=""><div class="lightbox-cap" id="lightbox-cap"></div></div></div>
<script>
(() => {
  const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const lightbox = document.getElementById("lightbox");
  function openLightbox(src, alt, caption){document.getElementById("lightbox-img").src=src;document.getElementById("lightbox-img").alt=alt||"Gallery photo";document.getElementById("lightbox-cap").textContent=caption||"";lightbox.classList.add("open");document.body.style.overflow="hidden"}
  function closeLightbox(){lightbox.classList.remove("open");document.body.style.overflow=""}
  document.getElementById("close").addEventListener("click",closeLightbox);lightbox.addEventListener("click",e=>{if(e.target===lightbox)closeLightbox()});addEventListener("keydown",e=>{if(e.key==="Escape")closeLightbox()});
  function migrateGallery(g){if(Array.isArray(g.albums))return g.albums;if(Array.isArray(g.items)&&g.items.length)return [{title:"Academic Moments",date:"",location:"",description:"",photos:g.items}];return []}
  async function init(){
    try{
      const r=await fetch("../data.json",{cache:"no-store"});if(!r.ok)throw new Error("Could not load data.json");const d=await r.json();const g=d.gallery||{};const albums=migrateGallery(g).filter(a=>Array.isArray(a.photos)&&a.photos.some(p=>p.image));
      document.title=`${g.navLabel||"Gallery"} · ${d.hero?.name||"KyuTae Hwang"}`;document.getElementById("headline").textContent=g.headline||"Academic Gallery";document.getElementById("intro").textContent=g.intro||"Conference talks, presentations, and academic moments.";document.getElementById("footer-name").textContent=d.hero?.name||"KyuTae Hwang";
      if(!albums.length){document.getElementById("empty").hidden=false;return}
      document.getElementById("albums").innerHTML=albums.map((a,i)=>`<section class="album"><div class="album-head"><div><div class="eyebrow">${String(i+1).padStart(2,"0")} · Album</div><h2>${esc(a.title||`Album ${i+1}`)}</h2><div class="meta">${[a.date,a.location].filter(Boolean).map(esc).join(" · ")}</div></div><p class="desc">${esc(a.description||"")}</p></div><div class="grid">${(a.photos||[]).filter(p=>p.image).map(p=>`<figure class="photo" data-src="${esc(p.image)}" data-alt="${esc(p.alt||p.caption||"")}" data-caption="${esc(p.caption||"")}"><img src="../${esc(p.image)}" alt="${esc(p.alt||p.caption||"Gallery photo")}" loading="lazy">${g.showCaptions===false||!p.caption?"":`<figcaption>${esc(p.caption)}</figcaption>`}</figure>`).join("")}</div></section>`).join("");
      document.querySelectorAll(".photo").forEach(el=>el.addEventListener("click",()=>openLightbox(`../${el.dataset.src}`,el.dataset.alt,el.dataset.caption)));
    }catch(err){document.getElementById("empty").hidden=false;document.getElementById("empty").textContent=`Gallery could not be loaded: ${err.message}`}
  }
  init();
})();
</script>
</body>
</html>
